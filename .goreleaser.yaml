version: 2

project_name: goclean

before:
  hooks:
    - go mod tidy

builds:
  - id: goclean
    main: ./cmd/goclean
    binary: goclean
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: goclean
    repository:
      owner: jalioba
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/jalioba/GoClean"
    description: "Concurrent disk space analyzer and developer cache cleaner"
    license: "MIT"
    folder: Formula

scoops:
  - repository:
      owner: jalioba
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/jalioba/GoClean"
    description: "Concurrent disk space analyzer and developer cache cleaner"
    license: "MIT"
